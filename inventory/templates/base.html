
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}
        Blood Bank Management System
        {% endblock %}
    </title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }

        nav {
            background-color: #8B0000;
            padding: 15px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-right: 20px;
            font-weight: bold;
        }

        nav a:hover {
            text-decoration: underline;
        }

        .container {
            padding: 25px;
        }

        h1, h2 {
            color: #8B0000;
        }

        button {
            padding: 8px 15px;
            cursor: pointer;
        }

        select {
            padding: 8px;
        }
    </style>
</head>

<body>
    <nav>
        <a href="{% url 'home' %}">Home</a>
        <a href="{% url 'availability_search' %}">Availability</a>
        <a href="{% url 'inventory_summary' %}">Inventory Summary</a>

        {% if user.is_authenticated %}
            {% if user.is_staff %}
                <a href="/admin/">Admin</a>
            {% endif %}
        {% endif %}
    </nav>

    <div class="container">
        {% block content %}
        {% endblock %}
    </div>
</body>
</html>
