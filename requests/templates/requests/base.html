{% load static %}
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Blood Bank Requests{% endblock %}</title>
    <style>
        :root { --ink: #24252a; --muted: #6d6f78; --red: #b42331; --pale: #fff7f5; --line: #e8deda; --white: #fff; }
        * { box-sizing: border-box; }
        body { margin: 0; color: var(--ink); background: #f5f1ef; font: 16px/1.5 Georgia, serif; }
        header { padding: 24px 7vw; background: var(--red); color: var(--white); }
        header a { color: inherit; text-decoration: none; }
        header strong { font-size: 1.25rem; letter-spacing: .03em; }
        main { width: min(920px, 86vw); margin: 48px auto; }
        .panel { background: var(--white); border: 1px solid var(--line); padding: clamp(24px, 5vw, 52px); box-shadow: 0 14px 40px rgba(58, 35, 30, .08); }
        h1 { margin: 0 0 10px; font-size: clamp(2rem, 5vw, 3.4rem); line-height: 1; }
        h2 { margin-top: 0; }
        .intro, .muted { color: var(--muted); }
        .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
        label { display: block; margin-bottom: 7px; font-weight: bold; }
        input, select, textarea { width: 100%; border: 1px solid #cfc2be; padding: 12px; color: var(--ink); background: #fff; font: inherit; }
        textarea { resize: vertical; }
        .field { margin-top: 22px; }
        .errorlist { margin: 6px 0 0; padding: 0; color: var(--red); list-style: none; }
        .button { display: inline-block; border: 0; padding: 13px 20px; background: var(--red); color: #fff; font: bold 1rem Georgia, serif; cursor: pointer; text-decoration: none; }
        .button.secondary { background: #eee5e2; color: var(--ink); }
        .actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 30px; }
        .notice { margin-bottom: 24px; padding: 14px 16px; background: #fff0ed; border-left: 4px solid var(--red); }
        .summary { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1px; margin: 28px 0; background: var(--line); border: 1px solid var(--line); }
        .summary div { padding: 16px; background: #fff; }
        .summary dt { color: var(--muted); font-size: .85rem; }
        .summary dd { margin: 3px 0 0; font-size: 1.1rem; }
        .status { display: inline-block; padding: 4px 9px; border-radius: 99px; background: #eee5e2; font: bold .85rem Arial, sans-serif; }
        .status.approved, .status.fulfilled { background: #e2f2e7; color: #21633a; }
        .status.rejected { background: #f9e1df; color: #942b31; }
        .request-row { border-top: 1px solid var(--line); padding: 20px 0; }
        .request-row:first-child { border-top: 0; }
        .request-meta { display: flex; justify-content: space-between; gap: 12px; align-items: start; }
        .review-form { margin-top: 14px; padding: 16px; background: var(--pale); }
        .radio { display: flex; gap: 16px; }
        .radio label { font-weight: normal; }
        .radio input { width: auto; }
        @media (max-width: 640px) { main { margin: 24px auto; } .grid, .summary { grid-template-columns: 1fr; } .request-meta { display: block; } }
    </style>
</head>
<body>
    <header><a href="{% url 'requests:create' %}"><strong>Blood Bank / Request Desk</strong></a></header>
    <main>
        {% for message in messages %}<div class="notice">{{ message }}</div>{% endfor %}
        {% block content %}{% endblock %}
    </main>
</body>
</html>
